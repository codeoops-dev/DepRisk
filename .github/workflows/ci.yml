name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Smoke test the CLI
        run: dotnet run --no-build -c Release --project src/DepRisk.Cli -- --version

      # Contract test: DepRisk scans its own restored projects, and the JSON must match the published schema.
      - name: Scan output matches schemas/scan-result.v1.schema.json
        if: runner.os == 'Linux'
        run: |
          dotnet --version
          dotnet run --no-build -c Release --project src/DepRisk.Cli -- scan . --format json --out scan-result.json
          python3 -m pip install --user check-jsonschema==0.38.2
          python3 -m check_jsonschema --schemafile schemas/scan-result.v1.schema.json scan-result.json

      # Contract test: a real init + scan + verify in a scratch directory; every audit line must match its schema.
      - name: Audit log matches schemas/audit-entry.v1.schema.json and verifies
        if: runner.os == 'Linux'
        run: |
          cli="$GITHUB_WORKSPACE/src/DepRisk.Cli/bin/Release/net10.0/deprisk.dll"
          work="$(mktemp -d)"
          cd "$work"
          dotnet "$cli" init
          dotnet "$cli" scan "$GITHUB_WORKSPACE" --format json --out scan.json
          dotnet "$cli" audit verify
          python3 - <<'PY'
          import json, os, jsonschema
          schema_path = os.path.join(os.environ["GITHUB_WORKSPACE"], "schemas", "audit-entry.v1.schema.json")
          validator = jsonschema.Draft202012Validator(json.load(open(schema_path)))
          count = 0
          for number, line in enumerate(open(".deprisk/audit.log", encoding="utf-8"), 1):
              validator.validate(json.loads(line))
              count += 1
          assert count == 2, f"expected 2 entries, found {count}"
          print(f"{count} audit entries match the schema")
          PY

      # Contract test: match this repository's own restored projects against a synthetic advisory.
      - name: Findings output matches schemas/findings.v1.schema.json
        if: runner.os == 'Linux'
        run: |
          adv="$(mktemp -d)"
          cat > "$adv/DEPRISK-CI-0001.json" <<'JSON'
          {
            "id": "DEPRISK-CI-0001",
            "summary": "Synthetic advisory used by the CI contract test",
            "database_specific": { "severity": "LOW" },
            "affected": [
              {
                "package": { "ecosystem": "NuGet", "name": "newtonsoft.json" },
                "ranges": [ { "type": "ECOSYSTEM", "events": [ { "introduced": "0" }, { "fixed": "9999.0.0" } ] } ]
              }
            ]
          }
          JSON
          dotnet run --no-build -c Release --project src/DepRisk.Cli -- match . --advisories "$adv" --format json --out findings.json
          python3 -m check_jsonschema --schemafile schemas/findings.v1.schema.json findings.json
          python3 - <<'PY'
          import json
          doc = json.load(open("findings.json", encoding="utf-8"))
          assert doc["findings"], "expected at least one finding for Newtonsoft.Json"
          assert all(f["id"] == "DEPRISK-CI-0001" for f in doc["findings"])
          print(len(doc["findings"]), "finding(s); schema OK")
          PY

      # Contract test: rank this repository's own restored projects with synthetic advisory, EPSS, and KEV data.
      - name: Ranking output matches schemas/ranking.v1.schema.json
        if: runner.os == 'Linux'
        run: |
          data="$(mktemp -d)"
          mkdir "$data/osv"
          cat > "$data/osv/DEPRISK-CI-0002.json" <<'JSON'
          {
            "id": "DEPRISK-CI-0002",
            "aliases": ["CVE-2099-0001"],
            "summary": "Synthetic advisory used by the CI contract test",
            "severity": [ { "type": "CVSS_V3", "score": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H" } ],
            "database_specific": { "severity": "CRITICAL" },
            "affected": [
              {
                "package": { "ecosystem": "NuGet", "name": "newtonsoft.json" },
                "ranges": [ { "type": "ECOSYSTEM", "events": [ { "introduced": "0" }, { "fixed": "9999.0.0" } ] } ]
              }
            ]
          }
          JSON
          printf '#model_version:v0,score_date:2099-01-01T00:00:00Z\ncve,epss,percentile\nCVE-2099-0001,0.25,0.9\n' > "$data/epss.csv"
          echo '{ "catalogVersion": "ci", "dateReleased": "2099-01-01T00:00:00Z", "vulnerabilities": [ { "cveID": "CVE-2099-0001", "dateAdded": "2099-01-01", "knownRansomwareCampaignUse": "Unknown" } ] }' > "$data/kev.json"
          dotnet run --no-build -c Release --project src/DepRisk.Cli -- rank . --advisories "$data/osv" --epss "$data/epss.csv" --kev "$data/kev.json" --format json --out ranking.json
          python3 -m check_jsonschema --schemafile schemas/ranking.v1.schema.json ranking.json
          python3 - <<'PY'
          import json
          doc = json.load(open("ranking.json", encoding="utf-8"))
          assert doc["findings"], "expected at least one finding for Newtonsoft.Json"
          first = doc["findings"][0]
          assert first["rank"] == 1 and first["signals"]["kev"] is not None and first["signals"]["epss"] is not None
          assert first["signals"]["cvss"]["baseScore"] == 9.8
          print(len(doc["findings"]), "ranked finding(s); schema OK")
          PY
