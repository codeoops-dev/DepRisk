name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Smoke test the CLI
        run: dotnet run --no-build -c Release --project src/DepRisk.Cli -- --version

      # Contract test: DepRisk scans its own restored projects, and the JSON must match the published schema.
      - name: Scan output matches schemas/scan-result.v1.schema.json
        if: runner.os == 'Linux'
        run: |
          dotnet run --no-build -c Release --project src/DepRisk.Cli -- scan . --format json --out scan-result.json
          python3 -m pip install --user check-jsonschema==0.38.2
          python3 -m check_jsonschema --schemafile schemas/scan-result.v1.schema.json scan-result.json
