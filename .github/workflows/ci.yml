name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Smoke test the CLI
        run: dotnet run --no-build -c Release --project src/DepRisk.Cli -- --version

      # The steps below scan the repository root as a NuGet project. A lockfile fixture stored under its real name (package-lock.json)
      # would make the scan find a second ecosystem and fail with exit code 4, so fixtures use another name (package-lock.fixture.json).
      - name: No npm lockfile under its real name in the repository
        if: runner.os == 'Linux'
        run: |
          found="$(git ls-files | grep -E '(^|/)package-lock\.json$' || true)"
          if [ -n "$found" ]; then
            echo "A file named package-lock.json is tracked, which makes 'deprisk scan .' find npm as well as NuGet:"
            echo "$found"
            echo "Store lockfile fixtures as package-lock.fixture.json and copy them to package-lock.json in the test or step that needs them."
            exit 1
          fi

      # Contract test: DepRisk scans its own restored projects, and the JSON must match the published schema.
      - name: Scan output matches schemas/scan-result.v1.schema.json
        if: runner.os == 'Linux'
        run: |
          dotnet --version
          dotnet run --no-build -c Release --project src/DepRisk.Cli -- scan . --format json --out scan-result.json
          python3 -m pip install --user check-jsonschema==0.38.2
          python3 -m check_jsonschema --schemafile schemas/scan-result.v1.schema.json scan-result.json

      # Contract test: a real init + scan + verify in a scratch directory; every audit line must match its schema.
      - name: Audit log matches schemas/audit-entry.v1.schema.json and verifies
        if: runner.os == 'Linux'
        run: |
          cli="$GITHUB_WORKSPACE/src/DepRisk.Cli/bin/Release/net10.0/deprisk.dll"
          work="$(mktemp -d)"
          cd "$work"
          dotnet "$cli" init
          dotnet "$cli" scan "$GITHUB_WORKSPACE" --format json --out scan.json
          dotnet "$cli" audit verify
          python3 - <<'PY'
          import json, os, jsonschema
          schema_path = os.path.join(os.environ["GITHUB_WORKSPACE"], "schemas", "audit-entry.v1.schema.json")
          validator = jsonschema.Draft202012Validator(json.load(open(schema_path)))
          count = 0
          for number, line in enumerate(open(".deprisk/audit.log", encoding="utf-8"), 1):
              validator.validate(json.loads(line))
              count += 1
          assert count == 2, f"expected 2 entries, found {count}"
          print(f"{count} audit entries match the schema")
          PY

      # Contract test: match this repository's own restored projects against a synthetic advisory.
      - name: Findings output matches schemas/findings.v1.schema.json
        if: runner.os == 'Linux'
        run: |
          adv="$(mktemp -d)"
          cat > "$adv/DEPRISK-CI-0001.json" <<'JSON'
          {
            "id": "DEPRISK-CI-0001",
            "summary": "Synthetic advisory used by the CI contract test",
            "database_specific": { "severity": "LOW" },
            "affected": [
              {
                "package": { "ecosystem": "NuGet", "name": "newtonsoft.json" },
                "ranges": [ { "type": "ECOSYSTEM", "events": [ { "introduced": "0" }, { "fixed": "9999.0.0" } ] } ]
              }
            ]
          }
          JSON
          dotnet run --no-build -c Release --project src/DepRisk.Cli -- match . --advisories "$adv" --format json --out findings.json
          python3 -m check_jsonschema --schemafile schemas/findings.v1.schema.json findings.json
          python3 - <<'PY'
          import json
          doc = json.load(open("findings.json", encoding="utf-8"))
          assert doc["findings"], "expected at least one finding for Newtonsoft.Json"
          assert all(f["id"] == "DEPRISK-CI-0001" for f in doc["findings"])
          print(len(doc["findings"]), "finding(s); schema OK")
          PY

      # Contract test: rank this repository's own restored projects with synthetic advisory, EPSS, and KEV data.
      - name: Ranking output matches schemas/ranking.v1.schema.json
        if: runner.os == 'Linux'
        run: |
          data="$(mktemp -d)"
          mkdir "$data/osv"
          cat > "$data/osv/DEPRISK-CI-0002.json" <<'JSON'
          {
            "id": "DEPRISK-CI-0002",
            "aliases": ["CVE-2099-0001"],
            "summary": "Synthetic advisory used by the CI contract test",
            "severity": [ { "type": "CVSS_V3", "score": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H" } ],
            "database_specific": { "severity": "CRITICAL" },
            "affected": [
              {
                "package": { "ecosystem": "NuGet", "name": "newtonsoft.json" },
                "ranges": [ { "type": "ECOSYSTEM", "events": [ { "introduced": "0" }, { "fixed": "9999.0.0" } ] } ]
              }
            ]
          }
          JSON
          printf '#model_version:v0,score_date:2099-01-01T00:00:00Z\ncve,epss,percentile\nCVE-2099-0001,0.25,0.9\n' > "$data/epss.csv"
          echo '{ "catalogVersion": "ci", "dateReleased": "2099-01-01T00:00:00Z", "vulnerabilities": [ { "cveID": "CVE-2099-0001", "dateAdded": "2099-01-01", "knownRansomwareCampaignUse": "Unknown" } ] }' > "$data/kev.json"
          dotnet run --no-build -c Release --project src/DepRisk.Cli -- rank . --advisories "$data/osv" --epss "$data/epss.csv" --kev "$data/kev.json" --format json --out ranking.json
          python3 -m check_jsonschema --schemafile schemas/ranking.v1.schema.json ranking.json
          python3 - <<'PY'
          import json
          doc = json.load(open("ranking.json", encoding="utf-8"))
          assert doc["findings"], "expected at least one finding for Newtonsoft.Json"
          first = doc["findings"][0]
          assert first["rank"] == 1 and first["signals"]["kev"] is not None and first["signals"]["epss"] is not None
          assert first["signals"]["cvss"]["baseScore"] == 9.8
          print(len(doc["findings"]), "ranked finding(s); schema OK")
          PY

      # Contract test: a real npm lock file (written by npm, kept in tests/fixtures) goes through scan, match, and rank.
      - name: npm outputs match the schemas
        if: runner.os == 'Linux'
        run: |
          lock=tests/fixtures/npm/simple.package-lock.json
          adv="$(mktemp -d)"
          cat > "$adv/DEPRISK-CI-0002.json" <<'JSON'
          {
            "id": "DEPRISK-CI-0002",
            "summary": "Synthetic advisory used by the CI contract test",
            "database_specific": { "severity": "LOW" },
            "affected": [
              {
                "package": { "ecosystem": "npm", "name": "ms" },
                "ranges": [ { "type": "SEMVER", "events": [ { "introduced": "0" }, { "fixed": "2.1.3" } ] } ]
              }
            ]
          }
          JSON
          cli="dotnet run --no-build -c Release --project src/DepRisk.Cli --"
          $cli scan "$lock" --ecosystem npm --format json --out npm-scan.json
          $cli match "$lock" --ecosystem npm --advisories "$adv" --format json --out npm-findings.json
          $cli rank "$lock" --ecosystem npm --advisories "$adv" --format json --out npm-ranking.json
          python3 -m check_jsonschema --schemafile schemas/scan-result.v1.schema.json npm-scan.json
          python3 -m check_jsonschema --schemafile schemas/findings.v1.schema.json npm-findings.json
          python3 -m check_jsonschema --schemafile schemas/ranking.v1.schema.json npm-ranking.json
          python3 - <<'PY'
          import json
          findings = json.load(open("npm-findings.json", encoding="utf-8"))
          assert findings["ecosystem"] == "npm"
          assert [f["package"]["version"] for f in findings["findings"]] == ["2.0.0"], findings["findings"]
          print("npm scan, match, and rank match the schemas")
          PY

      # Contract test: the npm hypergraph (path-based resolution) of the same real lock files.
      - name: npm graph output matches schemas/graph.v1.schema.json
        if: runner.os == 'Linux'
        run: |
          cli="dotnet run --no-build -c Release --project src/DepRisk.Cli --"
          for name in simple workspaces; do
            $cli graph "tests/fixtures/npm/$name.package-lock.json" --ecosystem npm --format json --out "npm-graph-$name.json"
            python3 -m check_jsonschema --schemafile schemas/graph.v1.schema.json "npm-graph-$name.json"
          done
          python3 - <<'PY'
          import json
          doc = json.load(open("npm-graph-simple.json", encoding="utf-8"))
          target = doc["projects"][0]["targets"][0]
          assert doc["ecosystem"] == "npm"
          assert target["stats"]["violated"] == 0, target["stats"]
          debug = next(e for e in target["hyperedges"] if e["id"] == "node_modules/debug")
          assert debug["requires"][0]["resolvedPath"] == "node_modules/debug/node_modules/ms", debug
          print("npm graph matches the schema; nested resolution OK")
          PY

      # Contract test: SARIF for this repository's own projects must validate against the official SARIF 2.1.0 schema,
      # which is fetched here and pinned by its SHA-256, and the policy gate must behave.
      - name: SARIF output validates against the official schema, and the policy gate works
        if: runner.os == 'Linux'
        run: |
          data="$(mktemp -d)"
          mkdir "$data/osv"
          cat > "$data/osv/DEPRISK-CI-0003.json" <<'JSON'
          {
            "id": "DEPRISK-CI-0003",
            "aliases": ["CVE-2099-0002"],
            "summary": "Synthetic advisory used by the CI contract test",
            "severity": [ { "type": "CVSS_V3", "score": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H" } ],
            "database_specific": { "severity": "CRITICAL" },
            "affected": [
              {
                "package": { "ecosystem": "NuGet", "name": "newtonsoft.json" },
                "ranges": [ { "type": "ECOSYSTEM", "events": [ { "introduced": "0" }, { "fixed": "9999.0.0" } ] } ]
              }
            ]
          }
          JSON
          curl -fsSL -o sarif-schema-2.1.0.json https://raw.githubusercontent.com/oasis-tcs/sarif-spec/main/sarif-2.1/schema/sarif-schema-2.1.0.json
          echo "c3b4bb2d6093897483348925aaa73af03b3e3f4bd4ca38cef26dcb4212a2682e  sarif-schema-2.1.0.json" | sha256sum -c -
          cli="dotnet run --no-build -c Release --project src/DepRisk.Cli --"
          $cli ci . --advisories "$data/osv" --format sarif --out deprisk.sarif
          python3 -m check_jsonschema --schemafile sarif-schema-2.1.0.json deprisk.sarif
          # The gate: a critical finding with a known fix must fail the build (exit code 1) and an impossible policy must pass.
          set +e
          $cli ci . --advisories "$data/osv" --fail-on "cvss>=9&fixable" --format json --out gate.json
          fail_code=$?
          $cli ci . --advisories "$data/osv" --fail-on "ransomware" --format json --out gate.json
          pass_code=$?
          $cli ci . --advisories "$data/osv" --fail-on "reachable" --format json --out gate.json
          invalid_code=$?
          set -e
          echo "gate exit codes: fail=$fail_code pass=$pass_code invalid=$invalid_code"
          test "$fail_code" = "1" && test "$pass_code" = "0" && test "$invalid_code" = "4"

      # Contract test: the hypergraph of this repository's own restored projects must match its schema.
      - name: Graph output matches schemas/graph.v1.schema.json
        if: runner.os == 'Linux'
        run: |
          dotnet run --no-build -c Release --project src/DepRisk.Cli -- graph . --format json --out graph.json
          python3 -m check_jsonschema --schemafile schemas/graph.v1.schema.json graph.json
          python3 - <<'PY'
          import json
          doc = json.load(open("graph.json", encoding="utf-8"))
          targets = [t for p in doc["projects"] for t in p["targets"]]
          assert targets, "expected at least one target"
          assert any(t["stats"]["hyperedges"] > 0 for t in targets), "expected hyperedges in the test projects"
          print(len(targets), "target(s); schema OK; violated =", sum(t["stats"]["violated"] for t in targets))
          PY

  reach-analyzer:
    name: reachability analyzer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: analyzers/reach
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt && rustup default stable

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      # Contract test: real analyzer output against the protocol schemas, on a fixture project.
      - name: Protocol matches the schemas
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          python3 -m pip install --user check-jsonschema==0.38.2
          python3 - <<'PY'
          import json, os
          root = os.path.abspath("tests/fixtures/reach/csharp")
          request = {
              "schemaVersion": 1,
              "root": root,
              "entrypoints": {"mode": "auto"},
              "targets": [
                  {"key": "reached", "symbols": ["Newtonsoft.Json.JsonConvert.DeserializeObject"], "complete": True},
                  {"key": "dead-code-only", "symbols": ["System.Net.Http.HttpClient.#ctor"], "complete": True},
              ],
          }
          json.dump(request, open("reach-request.json", "w", encoding="utf-8"))
          PY
          python3 -m check_jsonschema --schemafile schemas/reach-request.v1.schema.json reach-request.json
          analyzers/reach/target/release/deprisk-reach < reach-request.json > reach-result.json
          python3 -m check_jsonschema --schemafile schemas/reach-result.v1.schema.json reach-result.json
          python3 - <<'PY'
          import json
          result = json.load(open("reach-result.json", encoding="utf-8"))
          labels = {r["key"]: (r["label"], r["reason"]) for r in result["results"]}
          assert labels["reached"] == ("reachable", "static-path"), labels
          assert labels["dead-code-only"] == ("unreachable", "no-path"), labels
          assert result["stats"]["filesWithErrors"] == 0, result["stats"]
          print("reachability protocol matches the schemas;", labels)
          PY

  reach-e2e:
    name: reach command with the real analyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Build the analyzer
        run: cargo build --release --locked
        working-directory: analyzers/reach

      - name: Build the CLI
        run: dotnet build -c Release src/DepRisk.Cli

      # Contract test: the CLI and the analyzer together, on fixtures (a synthetic advisory, a symbol map, a C# source tree).
      - name: reach output matches schemas/reachability.v1.schema.json
        run: |
          python3 -m pip install --user check-jsonschema==0.38.2
          python3 -m check_jsonschema --schemafile schemas/symbol-map.v1.schema.json tests/fixtures/reach/symbols/example.json
          dotnet run --no-build -c Release --project src/DepRisk.Cli -- reach tests/fixtures/reach/assets \
            --source tests/fixtures/reach/csharp \
            --advisories tests/fixtures/reach/osv \
            --symbols tests/fixtures/reach/symbols \
            --analyzer analyzers/reach/target/release/deprisk-reach \
            --format json --out reach.json
          python3 -m check_jsonschema --schemafile schemas/reachability.v1.schema.json reach.json
          python3 - <<'PY'
          import json
          doc = json.load(open("reach.json", encoding="utf-8"))
          verdicts = {f["finding"]["id"]: (f["reachability"]["label"], f["reachability"]["reason"]) for f in doc["findings"]}
          assert verdicts["DEPRISK-EXAMPLE-0001"] == ("reachable", "static-path"), verdicts
          assert verdicts["DEPRISK-EXAMPLE-0002"] == ("unknown", "transitive-package-code-not-analyzed"), verdicts
          assert verdicts["DEPRISK-EXAMPLE-0003"] == ("unknown", "no-symbols"), verdicts
          assert doc["analyzer"]["name"] == "deprisk-reach" and doc["source"]["filesWithErrors"] == 0, doc["analyzer"]
          print("reach: CLI and analyzer agree with the schema and the expected verdicts", verdicts)
          PY

      # rank and ci with reachability, on the same fixtures: schema, order, and the gate.
      - name: rank and ci with reachability
        run: |
          cli="dotnet run --no-build -c Release --project src/DepRisk.Cli --"
          common="tests/fixtures/reach/assets --source tests/fixtures/reach/csharp --advisories tests/fixtures/reach/osv --symbols tests/fixtures/reach/symbols --analyzer analyzers/reach/target/release/deprisk-reach"
          $cli rank $common --format json --out rank-reach.json
          python3 -m check_jsonschema --schemafile schemas/ranking.v1.schema.json rank-reach.json
          python3 - <<'PY'
          import json
          doc = json.load(open("rank-reach.json", encoding="utf-8"))
          labels = {f["id"]: f["reachability"]["label"] for f in doc["findings"]}
          assert labels["DEPRISK-EXAMPLE-0001"] == "reachable", labels
          assert doc["reach"]["summary"]["reachable"] == 1, doc["reach"]
          print("rank carries the reachability verdicts:", labels)
          PY
          set +e
          $cli ci $common --fail-on reachable --format sarif --out ci-reach.sarif
          failing=$?
          $cli ci $common --fail-on unreachable --format json --out ci-pass.json
          passing=$?
          set -e
          echo "gate on 'reachable' exited with $failing; gate on 'unreachable' exited with $passing"
          test "$failing" = "1" || { echo "expected the gate on 'reachable' to fail (exit 1)"; exit 1; }
          test "$passing" = "0" || { echo "expected the gate on 'unreachable' to pass (exit 0)"; exit 1; }
          python3 - <<'PY'
          import json
          sarif = json.load(open("ci-reach.sarif", encoding="utf-8"))
          props = {r["ruleId"]: r["properties"].get("reachability") for r in sarif["runs"][0]["results"]}
          assert props["DEPRISK-EXAMPLE-0001"] == "reachable", props
          print("SARIF carries the reachability property:", props)
          PY

      # The uncertainty model: schema, determinism, and what the model is supposed to do with reachability.
      - name: rank --model risk
        run: |
          cli="dotnet run --no-build -c Release --project src/DepRisk.Cli --"
          common="tests/fixtures/reach/assets --source tests/fixtures/reach/csharp --advisories tests/fixtures/reach/osv --symbols tests/fixtures/reach/symbols --analyzer analyzers/reach/target/release/deprisk-reach"
          $cli rank $common --model risk --format json --out risk-1.json
          $cli rank $common --model risk --format json --out risk-2.json
          cmp risk-1.json risk-2.json
          python3 -m check_jsonschema --schemafile schemas/ranking.v1.schema.json risk-1.json
          printf '{"schemaVersion": 1, "impact": {"low": 5, "high": 8}}' > risk-params.json
          python3 -m check_jsonschema --schemafile schemas/risk-params.v1.schema.json risk-params.json
          $cli rank $common --model risk --risk-params risk-params.json --format json --out risk-custom.json
          python3 - <<'PY'
          import json
          doc = json.load(open("risk-1.json", encoding="utf-8"))
          custom = json.load(open("risk-custom.json", encoding="utf-8"))
          assert doc["method"] == "risk-monte-carlo" and doc["model"]["calibration"] == "uncalibrated-defaults", doc["model"]
          assert custom["model"]["calibration"] == "custom", custom["model"]
          by_id = {f["id"]: f for f in doc["findings"]}
          reached, transitive = by_id["DEPRISK-EXAMPLE-0001"], by_id["DEPRISK-EXAMPLE-0002"]
          assert reached["risk"]["reachMean"] > transitive["risk"]["reachMean"], "a reachable finding must have a higher Reach than an unknown one"
          assert all(f["risk"]["p50"] <= f["risk"]["p95"] <= f["risk"]["cvar95"] for f in doc["findings"])
          print("risk model: deterministic, valid, ordered:", [(f["rank"], f["id"], f["risk"]["mean"]) for f in doc["findings"]])
          PY

      # explain and the OpenVEX export, on the same fixtures.
      - name: explain and vex
        run: |
          cli="dotnet run --no-build -c Release --project src/DepRisk.Cli --"
          common="tests/fixtures/reach/assets --source tests/fixtures/reach/csharp --advisories tests/fixtures/reach/osv --symbols tests/fixtures/reach/symbols --analyzer analyzers/reach/target/release/deprisk-reach"
          $cli explain DEPRISK-EXAMPLE-0001 $common --model risk --format json --out explain.json
          python3 -m check_jsonschema --schemafile schemas/explain.v1.schema.json explain.json
          $cli vex $common --product pkg:nuget/Sample@1.0.0 --author "DepRisk CI" --timestamp 2026-11-05T12:00:00Z --out vex-1.json
          $cli vex $common --product pkg:nuget/Sample@1.0.0 --author "DepRisk CI" --timestamp 2026-11-05T12:00:00Z --out vex-2.json
          cmp vex-1.json vex-2.json
          python3 - <<'PY'
          import json
          ex = json.load(open("explain.json", encoding="utf-8"))
          f = ex["findings"][0]
          assert f["reachability"]["label"] == "reachable" and f["position"]["baselineRank"] is not None, f["position"]
          assert any("Path step 1" in line for line in f["evidence"]), f["evidence"]
          vex = json.load(open("vex-1.json", encoding="utf-8"))
          assert vex["@context"] == "https://openvex.dev/ns/v0.2.0" and vex["version"] == 1
          status = {s["vulnerability"]["name"]: s["status"] for s in vex["statements"]}
          assert status["DEPRISK-EXAMPLE-0001"] == "affected", status
          assert status["DEPRISK-EXAMPLE-0002"] == "under_investigation", status   # transitive: never not_affected
          assert status["DEPRISK-EXAMPLE-0003"] == "under_investigation", status   # no symbol list
          assert all(s["status"] != "affected" or s.get("action_statement") for s in vex["statements"])
          print("explain and vex:", status)
          PY

      # The benchmark harness on the synthetic smoke dataset: schemas, determinism, the leakage guard, and what the metrics must show.
      # The numbers of this dataset are test fixtures (synthetic: true) and are never reported as results.
      - name: bench (synthetic smoke)
        run: |
          cli="dotnet run --no-build -c Release --project src/DepRisk.Cli --"
          bench="bench --cases tests/fixtures/reach/bench-manifest.json --analyzer analyzers/reach/target/release/deprisk-reach"
          python3 -m check_jsonschema --schemafile schemas/bench-manifest.v1.schema.json tests/fixtures/reach/bench-manifest.json
          $cli $bench --format json --out bench-1.json
          $cli $bench --format json --out bench-2.json
          cmp bench-1.json bench-2.json
          python3 -m check_jsonschema --schemafile schemas/bench-result.v1.schema.json bench-1.json
          $cli $bench --split test --format json --out bench-test.json
          python3 -m check_jsonschema --schemafile schemas/bench-result.v1.schema.json bench-test.json
          python3 - <<'PY'
          import json
          doc = json.load(open("bench-1.json", encoding="utf-8"))
          assert doc["dataset"]["synthetic"] is True and doc["split"] == "dev", doc["dataset"]
          assert any("synthetic" in w for w in doc["warnings"]), doc["warnings"]
          assert doc["counts"]["labeled"] == 6 and doc["counts"]["unlabeled"] == 0, doc["counts"]
          methods = {m["id"]: m for m in doc["methods"]}
          assert methods["b2-baseline"]["averagePrecision"] == 0.75, methods["b2-baseline"]
          assert methods["b3-reachable-only"]["exploitedMissed"] == 1, methods["b3-reachable-only"]
          assert methods["b3c-not-unreachable"]["exploitedMissed"] == 0, methods["b3c-not-unreachable"]
          assert doc["reach"]["unsoundUnreachable"] == 0, doc["reach"]
          assert doc["model"]["calibration"] == "uncalibrated-defaults", doc["model"]
          test = json.load(open("bench-test.json", encoding="utf-8"))
          assert test["counts"]["cases"] == 1 and test["bootstrap"]["notComputedReason"], test["bootstrap"]
          print("bench: valid, deterministic, and the filters behave as labeled:", {k: v["averagePrecision"] for k, v in methods.items()})

          # A manifest whose signals are newer than signalsAsOf must be refused.
          m = json.load(open("tests/fixtures/reach/bench-manifest.json", encoding="utf-8"))
          m["signalsAsOf"] = "2026-01-10"
          m["outcomeWindow"]["from"] = "2026-01-11"
          json.dump(m, open("tests/fixtures/reach/bench-leak.json", "w", encoding="utf-8"))
          PY
          set +e
          $cli bench --cases tests/fixtures/reach/bench-leak.json --analyzer analyzers/reach/target/release/deprisk-reach 2> bench-leak.err
          leak=$?
          set -e
          rm tests/fixtures/reach/bench-leak.json
          cat bench-leak.err
          test "$leak" = "4" || { echo "expected the leakage guard to refuse the manifest (exit 4), got $leak"; exit 1; }
          grep -q "leakage guard" bench-leak.err

      # Fitting the Reach factor on the dev split of the synthetic smoke dataset (S12b): the file is valid, complete, deterministic, and
      # flagged when it is evaluated on the data it was fitted on. The fitted numbers are fixtures, not results.
      - name: bench calibrate (synthetic smoke)
        run: |
          cli="dotnet run --no-build -c Release --project src/DepRisk.Cli --"
          analyzer="analyzers/reach/target/release/deprisk-reach"
          manifest="tests/fixtures/reach/bench-manifest.json"
          set +e
          $cli bench calibrate --cases $manifest --analyzer $analyzer --out fitted-none.json 2> calibrate-none.err
          none=$?
          set -e
          test "$none" = "4" || { echo "expected 'nothing to fit' (exit 4) with the default minimum, got $none"; exit 1; }
          grep -q "nothing to fit" calibrate-none.err
          test ! -e fitted-none.json
          $cli bench calibrate --cases $manifest --analyzer $analyzer --min-count 1 --out fitted-1.json
          $cli bench calibrate --cases $manifest --analyzer $analyzer --min-count 1 --out fitted-2.json > /dev/null
          cmp fitted-1.json fitted-2.json
          python3 -m check_jsonschema --schemafile schemas/risk-params.v1.schema.json fitted-1.json
          $cli bench --cases $manifest --analyzer $analyzer --split test --risk-params fitted-1.json --format json --out bench-fitted-test.json
          $cli bench --cases $manifest --analyzer $analyzer --split dev --risk-params fitted-1.json --format json --out bench-fitted-dev.json
          python3 -m check_jsonschema --schemafile schemas/bench-result.v1.schema.json bench-fitted-test.json bench-fitted-dev.json
          python3 - <<'PY'
          import json
          fit = json.load(open("fitted-1.json", encoding="utf-8"))
          assert (fit["reach"]["reachable"]["alpha"], fit["reach"]["reachable"]["beta"]) == (3, 1), fit["reach"]
          assert (fit["reach"]["unknown"]["alpha"], fit["reach"]["unknown"]["beta"]) == (2, 3), fit["reach"]
          assert (fit["reach"]["unreachable"]["alpha"], fit["reach"]["unreachable"]["beta"]) == (1, 49), fit["reach"]
          assert "SYNTHETIC" in fit["provenance"] and "dev split" in fit["provenance"], fit["provenance"]
          test = json.load(open("bench-fitted-test.json", encoding="utf-8"))
          dev = json.load(open("bench-fitted-dev.json", encoding="utf-8"))
          assert test["model"]["calibration"] == "custom", test["model"]
          assert not any("fitted on the dev split" in w for w in test["warnings"]), test["warnings"]
          assert any("fitted on the dev split of this very dataset" in w for w in dev["warnings"]), dev["warnings"]
          print("bench calibrate: valid, deterministic, held-out evaluation unflagged, same-data evaluation flagged")
          PY

      # npm end to end (S13b): the CLI sends an npm project to the real analyzer as JavaScript and reads the labels back, through
      # reach, rank, and vex. The advisories, the symbol map and the project are synthetic fixtures (tests/fixtures/reach-npm).
      - name: reach on npm (real analyzer)
        run: |
          cli="dotnet run --no-build -c Release --project src/DepRisk.Cli --"
          analyzer="analyzers/reach/target/release/deprisk-reach"
          # The lockfile is stored as package-lock.fixture.json so that scanning the repository root does not find two ecosystems.
          f="$(mktemp -d)"
          cp -r tests/fixtures/reach-npm/. "$f"
          mv "$f/package-lock.fixture.json" "$f/package-lock.json"
          common="$f --advisories $f/osv --symbols $f/symbols --analyzer $analyzer"
          python3 -m check_jsonschema --schemafile schemas/symbol-map.v1.schema.json $f/symbols/npm-example.json
          $cli reach $common --format json --out reach-npm-1.json
          $cli reach $common --format json --out reach-npm-2.json
          cmp reach-npm-1.json reach-npm-2.json
          python3 -m check_jsonschema --schemafile schemas/reachability.v1.schema.json reach-npm-1.json
          $cli rank $common --model risk --format json --out rank-npm.json
          python3 -m check_jsonschema --schemafile schemas/ranking.v1.schema.json rank-npm.json
          $cli vex $common --product pkg:npm/demo-app@1.0.0 --author ci --format json --out vex-npm.json
          python3 - <<'PY'
          import json
          reach = json.load(open("reach-npm-1.json", encoding="utf-8"))
          assert reach["ecosystem"] == "npm", reach["ecosystem"]
          by = {f["finding"]["id"]: f["reachability"] for f in reach["findings"]}
          assert by["DEPRISK-NPM-0001"]["label"] == "reachable" and by["DEPRISK-NPM-0001"]["symbol"] == "example-lib::parse", by["DEPRISK-NPM-0001"]
          assert by["DEPRISK-NPM-0001"]["path"][-1]["to"] == "example-lib::parse", by["DEPRISK-NPM-0001"]["path"]
          assert by["DEPRISK-NPM-0002"]["label"] == "unreachable", by["DEPRISK-NPM-0002"]
          assert (by["DEPRISK-NPM-0003"]["label"], by["DEPRISK-NPM-0003"]["reason"]) == ("unknown", "transitive-package-code-not-analyzed"), by["DEPRISK-NPM-0003"]
          assert (by["DEPRISK-NPM-0004"]["label"], by["DEPRISK-NPM-0004"]["reason"]) == ("unknown", "symbol-list-incomplete"), by["DEPRISK-NPM-0004"]
          rank = json.load(open("rank-npm.json", encoding="utf-8"))
          assert {f["id"]: f["reachability"]["label"] for f in rank["findings"]}["DEPRISK-NPM-0001"] == "reachable"
          vex = json.load(open("vex-npm.json", encoding="utf-8"))
          status = {s["vulnerability"]["name"]: s["status"] for s in vex["statements"]}
          assert status == {"DEPRISK-NPM-0001": "affected", "DEPRISK-NPM-0002": "not_affected", "DEPRISK-NPM-0003": "under_investigation", "DEPRISK-NPM-0004": "under_investigation"}, status
          print("npm reach, rank and vex:", {k: v["label"] for k, v in by.items()})
          PY
          # A symbol map for the other language does not apply and is said so.
          mkdir -p csharp-only
          cp tests/fixtures/reach/symbols/example.json csharp-only/example.json
          $cli reach $f --advisories $f/osv --symbols csharp-only --analyzer $analyzer --format json --out reach-npm-csharp-map.json
          python3 - <<'PY'
          import json
          r = json.load(open("reach-npm-csharp-map.json", encoding="utf-8"))
          assert all(f["reachability"]["label"] == "unknown" for f in r["findings"]), r["summary"]
          assert any("no entries for JavaScript and TypeScript (npm)" in d for d in r["diagnostics"]), r["diagnostics"]
          print("a C# symbol map does not apply to npm")
          PY

      # OpenVEX against the official JSON schema (pinned by checksum) and a signed document verified with OpenSSL, an implementation
      # that is not ours (ADR 0021). The documents are made from synthetic fixtures.
      - name: openvex schema and signature
        run: |
          cli="dotnet run --no-build -c Release --project src/DepRisk.Cli --"
          analyzer="analyzers/reach/target/release/deprisk-reach"
          curl -fsSL -o openvex_json_schema.json https://raw.githubusercontent.com/openvex/spec/main/openvex_json_schema.json
          echo "9373597734ed1d3ea5161a8b46d3866c4a8cfe76fd632fdd16aef01fb34b3238  openvex_json_schema.json" | sha256sum -c -
          # A document with not_affected in it: the npm fixture has a direct, complete, unreachable finding.
          npm="$(mktemp -d)"
          cp -r tests/fixtures/reach-npm/. "$npm"
          mv "$npm/package-lock.fixture.json" "$npm/package-lock.json"
          npm_args="$npm --advisories $npm/osv --symbols $npm/symbols --analyzer $analyzer --product pkg:npm/demo-app@1.0.0 --author ci --timestamp 2026-11-12T12:00:00Z"
          $cli vex $npm_args --out vex-npm.json
          python3 -m check_jsonschema --schemafile openvex_json_schema.json vex-1.json vex-npm.json
          grep -q '"status": "not_affected"' vex-npm.json
          # Sign, verify with the tool, and verify again with OpenSSL.
          openssl ecparam -name prime256v1 -genkey -noout -out vex.key
          openssl ec -in vex.key -pubout -out vex.pub
          subject="tests/fixtures/reach-npm/package.json"
          $cli vex $npm_args --sign --key vex.key --subject-file $subject --out vex.intoto.json
          $cli vex verify vex.intoto.json --pubkey vex.pub --subject-file $subject
          python3 - <<'PY'
          import base64, json
          envelope = json.load(open("vex.intoto.json", encoding="utf-8"))
          payload = base64.b64decode(envelope["payload"])
          payload_type = envelope["payloadType"].encode()
          assert envelope["payloadType"] == "application/vnd.in-toto+json"
          open("pae.bin", "wb").write(b"DSSEv1 %d %s %d %s" % (len(payload_type), payload_type, len(payload), payload))
          open("sig.der", "wb").write(base64.b64decode(envelope["signatures"][0]["sig"]))
          statement = json.loads(payload)
          assert statement["_type"] == "https://in-toto.io/Statement/v1", statement["_type"]
          assert statement["predicateType"] == "https://openvex.dev/ns/v0.2.0"
          assert statement["subject"][0]["name"] == "package.json" and len(statement["subject"][0]["digest"]["sha256"]) == 64
          json.dump(statement["predicate"], open("predicate.json", "w", encoding="utf-8"))
          plain = json.load(open("vex-npm.json", encoding="utf-8"))
          assert statement["predicate"] == plain, "the predicate must be the unsigned document"
          tampered = dict(envelope)
          tampered["payload"] = base64.b64encode(payload.replace(b"\"author\":\"ci\"", b"\"author\":\"xx\"")).decode()
          json.dump(tampered, open("vex.tampered.json", "w", encoding="utf-8"))
          print("signed statement:", statement["subject"][0]["name"], "with", len(statement["predicate"]["statements"]), "statements")
          PY
          openssl dgst -sha256 -verify vex.pub -signature sig.der pae.bin
          python3 -m check_jsonschema --schemafile openvex_json_schema.json predicate.json
          # A changed document and another key must not verify (exit code 3).
          set +e
          $cli vex verify vex.tampered.json --pubkey vex.pub
          tampered=$?
          openssl ecparam -name prime256v1 -genkey -noout -out other.key
          openssl ec -in other.key -pubout -out other.pub
          $cli vex verify vex.intoto.json --pubkey other.pub
          other=$?
          set -e
          test "$tampered" = "3" || { echo "a changed document must not verify (expected exit 3, got $tampered)"; exit 1; }
          test "$other" = "3" || { echo "another key must not verify (expected exit 3, got $other)"; exit 1; }

  # The reachability analyzer on every platform the package bundles it for, then the package itself, installed as a tool and used
  # without --analyzer (ADR 0022). A platform that stops building, or a package that is not complete, is found here and not at release.
  analyzers:
    uses: ./.github/workflows/analyzer-build.yml

  package:
    needs: analyzers
    uses: ./.github/workflows/package.yml
