version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/analyzers/reach"
    schedule:
      interval: "weekly"
    groups:
      # The grammar and the runtime move together; one pull request, one CI run.
      tree-sitter:
        patterns:
          - "tree-sitter*"
