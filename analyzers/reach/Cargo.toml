[package]
name = "deprisk-reach"
version = "0.2.0-alpha.1"
edition = "2021"
rust-version = "1.89"
description = "DepRisk reachability analyzer for C#: builds a conservative call graph from entrypoints and checks whether vulnerable symbols can be reached."
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tree-sitter = "0.27"
tree-sitter-c-sharp = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
